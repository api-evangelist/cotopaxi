name: Cotopaxi
description: 'Cotopaxi is a Certified B Corporation outdoor gear and apparel brand (backpacks, jackets,
  and accessories) known for its "Do Good" mission and Gear for Good model. It sells direct-to-consumer
  on a Shopify storefront at cotopaxi.com. Cotopaxi publishes no first-party developer API, but its
  Shopify platform exposes real machine surfaces: OAuth2/OIDC customer authentication (Shopify Customer
  Accounts) at account.cotopaxi.com, a hosted Storefront MCP server at /api/mcp, and an authenticated
  Customer Account MCP API. Surfaced as a portfolio company of Forerunner Ventures.'
